[package]
name = "licens"
version = "0.1.0"
edition = "2021"
description = "A small CLI for adding license files to projects"
readme = "README.md"
license = "MIT"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
chrono = "0.4"

[dev-dependencies]
assert_cmd = "2.0"
predicates = "3.1"
tempfile = "3.10"
